; CYD pet - ESP32-2432S028 (two USB ports, CH340C)
; Two environments:
;   cyd_probe  - hardware probe: panel driver, colour order, LED, LDR
;   cyd        - the pet itself
; Flash the probe first, read the colour blocks, then flash the pet.

[platformio]
default_envs = cyd

[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
; 460800 dropped the link on this board; 115200 is slower but reliable.
upload_speed = 115200
board_build.flash_mode = qio
board_build.partitions = min_spiffs.csv
lib_ldf_mode = deep+

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bodmer/TJpg_Decoder@^1.0.12

; TFT_eSPI is configured here instead of editing User_Setup.h in the library,
; so the config stays inside the project. Switch ILI9341_2_DRIVER for
; ST7789_DRIVER (+ inversion) if the probe shows a negative image.
build_flags =
    -DUSER_SETUP_LOADED=1
    -DILI9341_2_DRIVER=1
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT7=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    ; 55 MHz is the value the CYD community uses for this panel; it halves the
    ; frame push time compared with 40 MHz, which is what tearing was costing.
    -DSPI_FREQUENCY=55000000
    -DSPI_READ_FREQUENCY=20000000
    -DUSE_HSPI_PORT=1
    ; Probe showed every colour inverted (red -> cyan, green -> magenta,
    ; blue -> yellow, white -> black), so the panel needs INVON at init.
    -DTFT_INVERSION_ON=1

[env:cyd_probe]
build_src_filter = +<probe_main.cpp>

[env:cyd]
build_src_filter = +<eyes_main.cpp>

; Recovery variants for a link that drops mid-upload: ROM loader instead of the
; esptool stub, and a slow baud rate. Slower to write, far more tolerant of a
; board whose USB power sags when the stub runs.
[env:cyd_probe_slow]
extends = env:cyd_probe
upload_speed = 57600
upload_flags = --no-stub

[env:cyd_slow]
extends = env:cyd
upload_speed = 57600
upload_flags = --no-stub
